<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{background:#050510;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;color:#e0e0ff;}
#wrapper{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;}
#topbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 4px;}
.score-block{display:flex;flex-direction:column;align-items:center;gap:1px;}
.score-label{font-size:10px;color:#336633;letter-spacing:2px;text-transform:uppercase;}
.score-val{font-size:22px;font-weight:bold;color:#44ff44;text-shadow:0 0 10px #00cc00;}
#mute-btn{background:transparent;border:1px solid #224422;color:#448844;padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;}
#mute-btn:hover{border-color:#44aa44;color:#88ff88;}
#canvas-wrap{position:relative;width:100%;}
canvas{display:block;width:100%;border-radius:10px;border:1px solid #112211;image-rendering:pixelated;}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,5,18,0.92);border-radius:10px;z-index:10;}
#overlay h1{font-size:28px;letter-spacing:4px;color:#44ff44;text-shadow:0 0 20px #00cc00,0 0 40px #006600;}
#overlay .sub{font-size:13px;color:#446644;text-align:center;line-height:1.8;padding:0 20px;}
#overlay .hi{font-size:14px;color:#66aa66;}
#start-btn{background:transparent;border:1px solid #226622;color:#44cc44;padding:11px 34px;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:2px;}
#start-btn:hover,#start-btn:active{border-color:#44ff44;color:#88ff88;text-shadow:0 0 8px #44ff44;}
#dpad{display:none;flex-direction:column;align-items:center;gap:4px;margin-top:4px;}
.drow{display:flex;gap:4px;}
.dbtn{width:58px;height:58px;background:rgba(20,60,20,0.4);border:1px solid #224422;border-radius:10px;color:#44aa44;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;}
.dbtn:active{background:rgba(40,100,40,0.5);color:#88ff88;}
.dbtn.center{background:transparent;border-color:transparent;pointer-events:none;}
@media (max-width:500px),(pointer:coarse){#dpad{display:flex;}}
</style>
</head>
<body>
<div id="wrapper">
  <div id="topbar">
    <div class="score-block"><span class="score-label">Score</span><span class="score-val" id="score-disp">0</span></div>
    <button id="mute-btn">🔊</button>
    <div class="score-block"><span class="score-label">Best</span><span class="score-val" id="hi-disp">0</span></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1>SNAKE</h1>
      <p class="sub">Arrow keys / WASD to move<br>D-pad on mobile</p>
      <p class="hi">Best: <span id="hi-start">0</span></p>
      <button id="start-btn">START</button>
    </div>
  </div>
  <div id="dpad">
    <div class="drow"><div class="dbtn center"></div><div class="dbtn" id="d-up">▲</div><div class="dbtn center"></div></div>
    <div class="drow"><div class="dbtn" id="d-left">◀</div><div class="dbtn center"></div><div class="dbtn" id="d-right">▶</div></div>
    <div class="drow"><div class="dbtn center"></div><div class="dbtn" id="d-down">▼</div><div class="dbtn center"></div></div>
  </div>
</div>

<script>
// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const COLS = 20, ROWS = 20, CELL = 20;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// ── Audio ─────────────────────────────────────────────────────
let audioCtx, muted = false;
const muteBtn = document.getElementById('mute-btn');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (muted) { masterGain && (masterGain.gain.value = 0); }
  else { masterGain && (masterGain.gain.value = 1); }
});

let masterGain = null;
function getAC() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

function playEat() {
  const a = getAC(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(440, t);
  o.frequency.exponentialRampToValueAtTime(880, t + 0.06);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.1);
}

function playTurn() {
  const a = getAC(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(200, t);
  g.gain.setValueAtTime(0.04, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.04);
}

function playDead() {
  const a = getAC(), t = a.currentTime;
  [300, 220, 160, 100].forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t + i * 0.1);
    g.gain.setValueAtTime(0.22, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.12);
    o.connect(g); g.connect(masterGain);
    o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.13);
  });
}

// ── Background Music ──────────────────────────────────────────
// A proper looping chiptune using scheduled Web Audio nodes
let bgmNodes = [], bgmRunning = false;

const BGM_MELODY = [
  // note hz, duration beats
  [330,1],[330,1],[0,1],[330,1],[0,1],[262,1],[330,1],[0,1],
  [392,2],[0,2],[196,2],[0,2],
  [262,1.5],[196,1],[0,1],[165,1.5],[220,1],[0,0.5],[247,1],[233,0.5],[220,1],
  [196,1],[330,1],[392,1],[440,1],[349,1],[392,0.5],[0,0.5],[330,1],[262,1],[220,1],[165,1],
];

const BGM_BASS = [
  [98,2],[0,2],[98,1],[0,1],[98,1],[0,1],
  [87,2],[0,2],[87,1],[0,1],[87,1],[0,1],
  [110,2],[0,2],[98,2],[0,2],
  [87,2],[0,2],[98,2],[0,2],
];

function scheduleBgm() {
  if (!bgmRunning) return;
  const a = getAC();
  const BPM = 160, beat = 60 / BPM;

  // master bgm gain
  const bgmGain = a.createGain();
  bgmGain.gain.value = 0.22;
  bgmGain.connect(masterGain);

  // melody channel
  const melGain = a.createGain(); melGain.gain.value = 0.5; melGain.connect(bgmGain);
  // bass channel
  const bassGain = a.createGain(); bassGain.gain.value = 0.6; bassGain.connect(bgmGain);
  // pulse/arp channel
  const arpGain = a.createGain(); arpGain.gain.value = 0.25; arpGain.connect(bgmGain);

  let longestEnd = a.currentTime;

  function scheduleTrack(notes, gainNode, type, detune) {
    let t = a.currentTime + 0.05;
    notes.forEach(([freq, dur]) => {
      const end = t + dur * beat;
      if (end > longestEnd) longestEnd = end;
      if (freq > 0) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.value = freq;
        if (detune) o.detune.value = detune;
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(1.0, t + 0.01);
        g.gain.setValueAtTime(1.0, end - 0.03);
        g.gain.linearRampToValueAtTime(0.0, end);
        o.connect(g); g.connect(gainNode);
        o.start(t); o.stop(end + 0.01);
        bgmNodes.push(o);
      }
      t += dur * beat;
    });
  }

  scheduleTrack(BGM_MELODY, melGain, 'square', 0);
  scheduleTrack(BGM_BASS, bassGain, 'triangle', 0);

  // simple arp on top — 8th note pulses on a chord
  const ARP = [196,247,294,247,196,247,294,247, 175,220,262,220,175,220,262,220,
               196,247,294,247,196,247,294,247, 175,220,262,220,175,220,262,220];
  let at = a.currentTime + 0.05;
  ARP.forEach(freq => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0, at);
    g.gain.linearRampToValueAtTime(1.0, at + 0.01);
    g.gain.linearRampToValueAtTime(0.0, at + beat * 0.4);
    o.connect(g); g.connect(arpGain);
    o.start(at); o.stop(at + beat * 0.5);
    bgmNodes.push(o);
    at += beat * 0.5;
  });

  // schedule next loop slightly before it ends
  const loopDelay = (longestEnd - a.currentTime - 0.1) * 1000;
  if (bgmRunning) {
    bgmNodes._loopTimer = setTimeout(scheduleBgm, Math.max(100, loopDelay));
  }
}

function startBgm() {
  if (bgmRunning) return;
  bgmRunning = true;
  scheduleBgm();
}

function stopBgm() {
  bgmRunning = false;
  clearTimeout(bgmNodes._loopTimer);
  bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
  bgmNodes = [];
}

// ── State ─────────────────────────────────────────────────────
let snake, dir, nextDir, food, score, hiScore, speed, gameState;
let particles = [], shakeX = 0, shakeY = 0, shakeFrames = 0;

const overlay = document.getElementById('overlay');
const scoreDisp = document.getElementById('score-disp');
const hiDisp = document.getElementById('hi-disp');
const hiStart = document.getElementById('hi-start');
hiScore = parseInt(localStorage.getItem('snake_hi') || '0');
hiDisp.textContent = hiScore; hiStart.textContent = hiScore;

function rndFood() {
  let pos;
  do { pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
  while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function initGame() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [{ x: cx, y: cy }, { x: cx-1, y: cy }, { x: cx-2, y: cy }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  food = rndFood();
  score = 0; speed = 140;
  particles = []; shakeFrames = 0;
  scoreDisp.textContent = 0;
}

// ── Particles (lightweight) ───────────────────────────────────
function spawnParticles(gx, gy) {
  const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const sp = 1.5 + Math.random() * 2.5;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
  }
}

// ── Draw ──────────────────────────────────────────────────────
function drawGrid() {
  ctx.strokeStyle = 'rgba(0,40,0,0.5)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
  }
}

function drawSnake() {
  // body — solid bold green rectangles, slightly inset
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    ctx.fillStyle = isHead ? '#00ff44' : '#00cc33';
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    // subtle inner highlight on head
    if (isHead) {
      ctx.fillStyle = 'rgba(180,255,200,0.25)';
      ctx.fillRect(seg.x * CELL + 3, seg.y * CELL + 3, CELL - 8, CELL - 8);
    }
  });
}

function drawFood() {
  const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
  const pulse = 0.75 + 0.25 * Math.sin(Date.now() * 0.007);
  const r = CELL * 0.38 * pulse;
  ctx.fillStyle = '#ff3355';
  ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
  // bright centre dot
  ctx.fillStyle = '#ffaacc';
  ctx.beginPath(); ctx.arc(fx - r * 0.25, fy - r * 0.25, r * 0.3, 0, Math.PI * 2); ctx.fill();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#00ff44';
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
}

function render() {
  ctx.save();
  if (shakeFrames > 0) {
    shakeX = (Math.random() - 0.5) * shakeFrames * 1.5;
    shakeY = (Math.random() - 0.5) * shakeFrames * 1.5;
    ctx.translate(shakeX, shakeY);
    shakeFrames--;
  }
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawFood();
  drawSnake();
  drawParticles();
  ctx.restore();
}

// ── Game loop ─────────────────────────────────────────────────
let lastTick = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  render();
  if (gameState !== 'playing') return;
  if (ts - lastTick < speed) return;
  lastTick = ts;

  dir = { ...nextDir };
  const nx = snake[0].x + dir.x, ny = snake[0].y + dir.y;

  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die(); return; }
  if (snake.some(s => s.x === nx && s.y === ny)) { die(); return; }

  const head = { x: nx, y: ny };
  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreDisp.textContent = score;
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('snake_hi', hiScore);
      hiDisp.textContent = hiScore;
    }
    spawnParticles(food.x, food.y);
    playEat();
    food = rndFood();
    speed = Math.max(65, speed - 2);
  } else {
    snake.pop();
  }

  // update particles on game tick (not every frame) keeps them snappy
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.12; });
  particles = particles.filter(p => p.life > 0);
}

function die() {
  shakeFrames = 12;
  playDead(); stopBgm();
  gameState = 'over';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1 style="color:#ff4444;text-shadow:0 0 20px #ff0000;">GAME OVER</h1>
    <div style="font-size:40px;font-weight:bold;color:#44ff44;text-shadow:0 0 14px #00cc00;">${score}</div>
    <p style="color:#446644;font-size:14px">Best: ${hiScore}</p>
    <button id="start-btn" style="background:transparent;border:1px solid #226622;color:#44cc44;padding:11px 34px;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:2px;">RESTART</button>
  `;
  document.getElementById('start-btn').addEventListener('click', startGame);
}

function startGame() {
  overlay.style.display = 'none';
  initGame();
  gameState = 'playing';
  stopBgm(); startBgm();
}

// ── Input ─────────────────────────────────────────────────────
const DIRS = {
  ArrowUp:{x:0,y:-1}, KeyW:{x:0,y:-1},
  ArrowDown:{x:0,y:1}, KeyS:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, KeyA:{x:-1,y:0},
  ArrowRight:{x:1,y:0}, KeyD:{x:1,y:0},
};
document.addEventListener('keydown', e => {
  const d = DIRS[e.code]; if (d) { e.preventDefault(); setDir(d); }
});
function setDir(d) {
  if (gameState !== 'playing') return;
  if (d.x !== 0 && dir.x !== 0) return;
  if (d.y !== 0 && dir.y !== 0) return;
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d; playTurn();
}

[['d-up',{x:0,y:-1}],['d-down',{x:0,y:1}],['d-left',{x:-1,y:0}],['d-right',{x:1,y:0}]].forEach(([id,d]) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); setDir(d); }, {passive:false});
  el.addEventListener('mousedown', () => setDir(d));
});

canvas.addEventListener('touchstart', e => e.preventDefault(), {passive:false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

let swipeStart = null;
canvas.addEventListener('touchstart', e => { const t = e.touches[0]; swipeStart = {x:t.clientX, y:t.clientY}; }, {passive:false});
canvas.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStart.x, dy = t.clientY - swipeStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
  else setDir(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
  swipeStart = null;
}, {passive:false});

// ── Boot ──────────────────────────────────────────────────────
gameState = 'idle';
initGame();
requestAnimationFrame(loop);
document.getElementById('start-btn').addEventListener('click', startGame);
</script>
</body>
</html>
