<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fruit Slicer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
body { background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; overflow: hidden; }
#hud { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 420px; padding: 8px 16px; color: #e8e8e8; }
#score-box { font-size: 24px; font-weight: 500; }
#lives-box { font-size: 20px; color: #e06060; letter-spacing: 5px; }
#hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
#level-box { font-size: 13px; color: #70c090; }
#coin-box { font-size: 13px; color: #f0c040; }
canvas { display: block; max-width: 420px; width: 100%; border-radius: 12px; border: 0.5px solid rgba(255,255,255,0.1); }
#warning { width: 100%; max-width: 420px; text-align: center; padding: 6px 16px; font-size: 12px; color: #cc3333; font-weight: 500; letter-spacing: 0.3px; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(13,17,23,0.92); z-index: 10; border-radius: 12px; }
#overlay h1 { font-size: 30px; font-weight: 500; color: #f0f0f0; letter-spacing: 2px; }
#overlay p { font-size: 14px; color: #8888aa; text-align: center; line-height: 1.7; padding: 0 24px; }
.big-score { font-size: 44px; font-weight: 500; color: #ffffff; }
.obtn { background: transparent; border: 0.5px solid #5a5aaa; color: #aaaaee; padding: 11px 32px; border-radius: 8px; font-size: 15px; cursor: pointer; }
.obtn:active { opacity: 0.7; }
#combo-display { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 500; color: #ffdd44; opacity: 0; pointer-events: none; z-index: 5; white-space: nowrap; }
.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 88%; }
.shop-item { background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.shop-item.owned { border-color: #50aa70; }
.shop-item.equipped { border-color: #5a8aee; background: rgba(90,138,238,0.12); }
.shop-item span.si-icon { font-size: 24px; }
.shop-item span.si-name { font-size: 13px; color: #ddddee; font-weight: 500; }
.shop-item span.si-price { font-size: 12px; color: #f0c040; }
.shop-item span.si-owned { font-size: 11px; color: #50aa70; }
.shop-item span.si-eq { font-size: 11px; color: #5a8aee; }
.shop-coins { font-size: 16px; color: #f0c040; font-weight: 500; }
.shop-section { font-size: 12px; color: #666688; text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; padding-left: 6%; }

    
    .back-to-abgames {
      position: fixed;
      top: 20px;

      z-index: 9999;

      color: #ddd6fe;
      text-decoration: none;
      font-weight: 700;

      transition: all 0.2s;

    .back-to-abgames:hover {
      background: linear-gradient(135deg, rgba(88,28,135,1), rgba(109,40,217,1));
      transform: translateX(-4px);
      box-shadow: 0 0 20px rgba(168,85,247,0.6);
    }
    
    .back-to-abgames:active {
      transform: translateX(-2px);
    }
</style>
</head>
<body>
  <a href="index.html" class="back-to-abgames" title="Return to ABGames Portal">
    <span>← Back to ABGames</span>
  </a>

<div id="hud">
  <div id="lives-box">♥ ♥ ♥</div>
  <div id="score-box">0</div>
  <div id="hud-right">
    <div id="level-box">LVL 1</div>
    <div id="coin-box">🪙 0</div>
  </div>
</div>
<div style="position:relative; width:100%; max-width:420px;">
  <canvas id="c"></canvas>
  <div id="combo-display"></div>
  <div id="overlay">
    <h1>Fruit Slicer</h1>
    <p>Swipe to slice fruit<br>Don't miss — and avoid bombs!</p>
    <button class="obtn" id="play-btn">Play</button>
  </div>
</div>
<div id="warning">⚠ If you lose, you lose everything — coins, lives, all of it.</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreBox = document.getElementById('score-box');
const livesBox = document.getElementById('lives-box');
const levelBox = document.getElementById('level-box');
const coinBox = document.getElementById('coin-box');
const comboEl = document.getElementById('combo-display');

// ---- Sound Engine ----
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSlice(isBomb) {
  const ac = getAudio();
  const t = ac.currentTime;
  if (isBomb) {
    // boom: low thud + rumble
    const buf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const env = Math.exp(-i / (ac.sampleRate * 0.15));
      d[i] = (Math.random()*2-1) * env;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
    const g = ac.createGain(); g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.5);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  } else {
    // juicy whoosh-thwack
    const osc = ac.createOscillator();
    const osc2 = ac.createOscillator();
    const g = ac.createGain();
    const g2 = ac.createGain();
    // high pitched slice whoosh
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900 + Math.random()*300, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.12);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t); osc.stop(t + 0.15);
    // soft thwack body
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(180 + Math.random()*80, t);
    osc2.frequency.exponentialRampToValueAtTime(60, t + 0.1);
    g2.gain.setValueAtTime(0.35, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc2.connect(g2); g2.connect(ac.destination);
    osc2.start(t); osc2.stop(t + 0.13);
  }
}

function playPop() {
  const ac = getAudio();
  const t = ac.currentTime;
  // bright bubbly pop
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300 + Math.random()*200, t);
  osc.frequency.exponentialRampToValueAtTime(700 + Math.random()*300, t + 0.06);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.14);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t); osc.stop(t + 0.18);
}

function playMiss() {
  const ac = getAudio();
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.exponentialRampToValueAtTime(80, t+0.25);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.28);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t); osc.stop(t+0.3);
}
// ----------------------

function resize() {
  const w = Math.min(window.innerWidth, 420);
  canvas.width = w;
  canvas.height = Math.min(window.innerHeight - 110, 520);
}
resize();
window.addEventListener('resize', resize);

const FRUITS = [
  { emoji: '🍉', color: '#e84040', inner: '#ff8080' },
  { emoji: '🍊', color: '#f07020', inner: '#ffa060' },
  { emoji: '🍋', color: '#e8d020', inner: '#fff080' },
  { emoji: '🍇', color: '#9940cc', inner: '#cc88ff' },
  { emoji: '🍓', color: '#e82040', inner: '#ff6080' },
  { emoji: '🍑', color: '#f08040', inner: '#ffc090' },
  { emoji: '🥝', color: '#508820', inner: '#90cc40' },
];

const TRAILS = [
  { id: 'white',  name: 'Classic',   icon: '⬜', price: 0,   color: 'rgba(255,255,255,0.8)',  owned: true },
  { id: 'fire',   name: 'Fire',      icon: '🔥', price: 50,  color: 'rgba(255,120,30,0.85)',  owned: false },
  { id: 'ice',    name: 'Ice',       icon: '❄',  price: 50,  color: 'rgba(100,200,255,0.85)', owned: false },
  { id: 'gold',   name: 'Gold',      icon: '✨', price: 100, color: 'rgba(255,210,30,0.9)',   owned: false },
  { id: 'purple', name: 'Shadow',    icon: '💜', price: 100, color: 'rgba(180,80,255,0.85)',  owned: false },
  { id: 'rainbow',name: 'Rainbow',   icon: '🌈', price: 200, color: null,                     owned: false },
];

let state = 'idle';
let score, lives, level, combo, comboTimer, coins, equippedTrail;
let fruits = [], slices = [], particles = [], slashPoints = [];
let spawnTimer = 0, levelTimer = 0, rainbowHue = 0;

function init() {
  score = 0; lives = 3; level = 1; combo = 0; comboTimer = 0;
  coins = 0; equippedTrail = 'white';
  TRAILS.forEach(t => { t.owned = t.price === 0; });
  fruits = []; slices = []; particles = []; slashPoints = [];
  spawnTimer = 0; levelTimer = 0;
  updateHUD();
}

function updateHUD() {
  scoreBox.textContent = score;
  livesBox.innerHTML = Array(lives).fill('♥').join(' ') || '&nbsp;';
  levelBox.textContent = 'LVL ' + level;
  coinBox.textContent = '🪙 ' + coins;
}

function spawnFruit() {
  const W = canvas.width, H = canvas.height;
  const x = 60 + Math.random() * (W - 120);
  const isBomb = Math.random() < 0.12 + level * 0.015;
  const fruit = isBomb ? null : FRUITS[Math.floor(Math.random() * FRUITS.length)];
  const speedY = -(8 + Math.random() * 2 + level * 0.2);
  const speedX = (Math.random() - 0.5) * 3;
  const r = isBomb ? 28 : 22 + Math.random() * 10;
  fruits.push({ x, y: H + r, vx: speedX, vy: speedY, r, rot: 0, rotSpeed: (Math.random()-0.5)*0.08, fruit, isBomb, sliced: false, opacity: 1 });
  playPop();
}

function drawFruit(f) {
  if (f.opacity <= 0) return;
  ctx.save();
  ctx.globalAlpha = f.opacity;
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);
  if (f.isBomb) {
    ctx.fillStyle = '#222'; ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.font = f.r + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💣', 0, 2);
  } else {
    ctx.fillStyle = f.fruit.color; ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
    ctx.font = (f.r*1.4) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.fruit.emoji, 0, 2);
  }
  ctx.restore();
}

function drawSlice(s) {
  if (s.opacity <= 0) return;
  ctx.save(); ctx.globalAlpha = s.opacity;
  ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  ctx.fillStyle = s.color;
  ctx.beginPath(); ctx.arc(0,0,s.r,s.startAngle,s.endAngle); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  if (s.inner) {
    ctx.fillStyle = s.inner;
    ctx.beginPath(); ctx.arc(0,0,s.r*0.6,s.startAngle,s.endAngle); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function spawnSlices(f) {
  const angle = Math.random() * Math.PI;
  for (let i = 0; i < 2; i++) {
    slices.push({ x: f.x, y: f.y, r: f.r, vx: (i===0?-1:1)*(1.5+Math.random()*2), vy: -2-Math.random()*2,
      rot: angle+i*Math.PI, rotSpeed: (Math.random()-0.5)*0.1,
      startAngle: i*Math.PI, endAngle: (i+1)*Math.PI,
      color: f.isBomb ? '#ff3333' : f.fruit.color,
      inner: f.isBomb ? null : f.fruit.inner,
      opacity: 1, gravity: 0.15 });
  }
  for (let i = 0; i < 8; i++) {
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4;
    particles.push({ x: f.x, y: f.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      color: f.isBomb ? '#ff6644' : f.fruit.color, r: 3+Math.random()*4, opacity: 1, gravity: 0.1 });
  }
}

function showCombo(n) {
  if (n < 2) return;
  comboEl.textContent = n + 'x combo! +' + (n*5);
  comboEl.style.opacity = '1';
  clearTimeout(comboEl._t);
  comboEl._t = setTimeout(() => { comboEl.style.opacity = '0'; }, 900);
}

let pointer = { down: false, x: 0, y: 0, px: 0, py: 0 };
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left)*(canvas.width/rect.width), y: (src.clientY - rect.top)*(canvas.height/rect.height) };
}

canvas.addEventListener('mousedown', e => { const p=getPos(e); pointer={down:true,x:p.x,y:p.y,px:p.x,py:p.y}; slashPoints=[p]; });
canvas.addEventListener('mousemove', e => {
  if (!pointer.down) return;
  const p=getPos(e); pointer.px=pointer.x; pointer.py=pointer.y; pointer.x=p.x; pointer.y=p.y;
  slashPoints.push(p); if(slashPoints.length>18) slashPoints.shift(); checkSlice();
});
canvas.addEventListener('mouseup', () => { pointer.down=false; slashPoints=[]; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const p=getPos(e); pointer={down:true,x:p.x,y:p.y,px:p.x,py:p.y}; slashPoints=[p]; }, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); if(!pointer.down) return;
  const p=getPos(e); pointer.px=pointer.x; pointer.py=pointer.y; pointer.x=p.x; pointer.y=p.y;
  slashPoints.push(p); if(slashPoints.length>18) slashPoints.shift(); checkSlice();
}, {passive:false});
canvas.addEventListener('touchend', () => { pointer.down=false; slashPoints=[]; });

function checkSlice() {
  if (state !== 'playing') return;
  const { x, y, px, py } = pointer;
  fruits.forEach(f => {
    if (f.sliced) return;
    const dx=f.x-x, dy=f.y-y, d=Math.sqrt(dx*dx+dy*dy);
    const moved=Math.sqrt((x-px)**2+(y-py)**2);
    if (d < f.r && moved > 4) {
      f.sliced=true; f.opacity=0; spawnSlices(f);
      playSlice(f.isBomb);
      if (f.isBomb) { endGame(); return; }
      combo++; comboTimer=60;
      const pts = 10 + (combo>1 ? combo*5 : 0);
      score += pts; coins += 10;
      showCombo(combo); updateHUD();
    }
  });
}

let trailTick = 0;

function drawTrail() {
  if (!pointer.down || slashPoints.length < 2) return;
  const trail = equippedTrail;
  trailTick++;

  if (trail === 'white') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      ctx.globalAlpha = t * 0.85;
      ctx.lineWidth = 2 + t * 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.restore();

  } else if (trail === 'fire') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // core flame line
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      ctx.globalAlpha = t * 0.95;
      ctx.lineWidth = 3 + t * 5;
      ctx.strokeStyle = `hsl(${20 + t*20},100%,${50+t*20}%)`;
      ctx.shadowBlur = 12; ctx.shadowColor = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // ember sparks
    if (slashPoints.length > 3 && trailTick % 2 === 0) {
      const tip = slashPoints[slashPoints.length-1];
      for (let k = 0; k < 3; k++) {
        particles.push({
          x: tip.x + (Math.random()-0.5)*6,
          y: tip.y + (Math.random()-0.5)*6,
          vx: (Math.random()-0.5)*2.5,
          vy: -1.5 - Math.random()*2,
          color: Math.random()<0.5 ? '#ff8800' : '#ffdd00',
          r: 1.5 + Math.random()*2, opacity: 0.9, gravity: 0.05
        });
      }
    }
    ctx.restore();

  } else if (trail === 'ice') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      ctx.globalAlpha = t * 0.9;
      ctx.lineWidth = 2 + t * 4;
      ctx.strokeStyle = `hsla(195,100%,${70+t*20}%,0.9)`;
      ctx.shadowBlur = 10; ctx.shadowColor = '#88eeff';
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // frost crystals
    if (slashPoints.length > 4 && trailTick % 3 === 0) {
      const idx = Math.floor(Math.random() * slashPoints.length);
      const pt = slashPoints[idx];
      const sz = 3 + Math.random() * 4;
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = '#aaeeff'; ctx.lineWidth = 1;
      for (let a = 0; a < 6; a++) {
        const ang = (a/6)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);
        ctx.lineTo(pt.x + Math.cos(ang)*sz, pt.y + Math.sin(ang)*sz);
        ctx.stroke();
      }
    }
    ctx.restore();

  } else if (trail === 'gold') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // glowing gold line
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      ctx.globalAlpha = t * 0.95;
      ctx.lineWidth = 3 + t * 4;
      ctx.strokeStyle = `hsl(45,100%,${55+t*20}%)`;
      ctx.shadowBlur = 14; ctx.shadowColor = '#ffcc00';
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // gold sparkles
    if (slashPoints.length > 3 && trailTick % 2 === 0) {
      const tip = slashPoints[slashPoints.length-1];
      for (let k = 0; k < 2; k++) {
        const a = Math.random()*Math.PI*2, sp = 0.5+Math.random()*1.5;
        particles.push({ x: tip.x+(Math.random()-0.5)*8, y: tip.y+(Math.random()-0.5)*8,
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-1,
          color: Math.random()<0.5 ? '#ffdd00' : '#ffffff', r: 2+Math.random()*2, opacity: 1, gravity: 0.02 });
      }
    }
    ctx.restore();

  } else if (trail === 'purple') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      ctx.globalAlpha = t * 0.92;
      ctx.lineWidth = 2 + t * 5;
      ctx.strokeStyle = `hsla(${270+t*30},80%,${50+t*20}%,0.9)`;
      ctx.shadowBlur = 16; ctx.shadowColor = '#9933ff';
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // smoke wisps
    if (slashPoints.length > 3 && trailTick % 2 === 0) {
      const tip = slashPoints[slashPoints.length-1];
      particles.push({ x: tip.x+(Math.random()-0.5)*10, y: tip.y+(Math.random()-0.5)*10,
        vx: (Math.random()-0.5)*1.2, vy: -0.8-Math.random(),
        color: `hsla(${270+Math.random()*40},70%,60%,1)`,
        r: 4+Math.random()*4, opacity: 0.7, gravity: -0.01 });
    }
    ctx.restore();

  } else if (trail === 'rainbow') {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < slashPoints.length; i++) {
      const t = i / slashPoints.length;
      rainbowHue = (rainbowHue + 3) % 360;
      ctx.globalAlpha = t * 0.95;
      ctx.lineWidth = 3 + t * 4;
      ctx.strokeStyle = `hsl(${(rainbowHue + i*18)%360},100%,60%)`;
      ctx.shadowBlur = 10; ctx.shadowColor = `hsl(${rainbowHue},100%,60%)`;
      ctx.beginPath();
      ctx.moveTo(slashPoints[i-1].x, slashPoints[i-1].y);
      ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // rainbow sparkles
    if (slashPoints.length > 3 && trailTick % 2 === 0) {
      const tip = slashPoints[slashPoints.length-1];
      for (let k = 0; k < 3; k++) {
        const a = Math.random()*Math.PI*2, sp = 1+Math.random()*2;
        particles.push({ x: tip.x+(Math.random()-0.5)*8, y: tip.y+(Math.random()-0.5)*8,
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-0.5,
          color: `hsl(${Math.random()*360},100%,65%)`, r: 2+Math.random()*3, opacity: 1, gravity: 0.03 });
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function loop() {
  requestAnimationFrame(loop);
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
  if (state !== 'playing') return;

  const spawnRate = Math.max(70, 140 - level*8);
  spawnTimer++; if (spawnTimer >= spawnRate) { spawnFruit(); spawnTimer=0; }

  levelTimer++;
  if (levelTimer >= 480) {
    level++; levelTimer=0; updateHUD();
    if (level % 5 === 0) { state='shop'; showShop(); return; }
  }

  if (comboTimer>0) { comboTimer--; if(comboTimer<=0) combo=0; }

  fruits.forEach(f => {
    f.vy+=0.16; f.x+=f.vx; f.y+=f.vy; f.rot+=f.rotSpeed;
    if (!f.sliced && f.y > H+f.r+10) {
      if (!f.isBomb) { lives--; updateHUD(); playMiss(); if(lives<=0) endGame(); }
      f.sliced=true; f.opacity=0;
    }
  });
  slices.forEach(s => { s.vy+=s.gravity; s.x+=s.vx; s.y+=s.vy; s.rot+=s.rotSpeed; s.opacity-=0.022; });
  particles.forEach(p => { p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.opacity-=0.03; p.r*=0.97; });
  fruits=fruits.filter(f=>f.opacity>0);
  slices=slices.filter(s=>s.opacity>0);
  particles=particles.filter(p=>p.opacity>0);

  slices.forEach(drawSlice);
  fruits.forEach(drawFruit);
  particles.forEach(p => {
    ctx.globalAlpha=p.opacity; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  drawTrail();
}

function showShop() {
  state = 'shop';
  renderShop();
}

function renderShop() {
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1 style="margin-bottom:0">Shop</h1>
    <p class="shop-coins">🪙 ${coins} coins</p>
    <p style="font-size:12px;color:#666688;margin-top:-8px">Every 5 levels</p>
    <span class="shop-section">Extra life</span>
    <div class="shop-grid" id="shop-lives"></div>
    <span class="shop-section">Swipe trails</span>
    <div class="shop-grid" id="shop-trails"></div>
    <button class="obtn" id="shop-continue">Continue</button>
    <p style="font-size:11px;color:#cc3333;margin-top:-4px">⚠ Lose the game = lose everything</p>
  `;

  const livesGrid = document.getElementById('shop-lives');
  const canAfford = coins >= 80;
  livesGrid.innerHTML = `
    <div class="shop-item${canAfford?'':' shop-item-disabled'}" id="buy-life" style="grid-column:1/-1;${canAfford?'':'opacity:0.4;cursor:default'}">
      <span class="si-icon">♥</span>
      <span class="si-name">+1 life</span>
      <span class="si-price">${canAfford ? '🪙 80' : '🪙 80 — not enough'}</span>
    </div>
  `;
  if (canAfford) {
    document.getElementById('buy-life').addEventListener('click', () => {
      coins -= 80; lives++; updateHUD(); renderShop();
    });
  }

  const trailsGrid = document.getElementById('shop-trails');
  trailsGrid.innerHTML = TRAILS.map(t => {
    const isEquipped = equippedTrail === t.id;
    const cls = isEquipped ? 'shop-item equipped' : (t.owned ? 'shop-item owned' : 'shop-item');
    const badge = isEquipped ? `<span class="si-eq">Equipped</span>` : (t.owned ? `<span class="si-owned">Owned</span>` : `<span class="si-price">🪙 ${t.price}</span>`);
    return `<div class="${cls}" data-trail="${t.id}"><span class="si-icon">${t.icon}</span><span class="si-name">${t.name}</span>${badge}</div>`;
  }).join('');

  trailsGrid.querySelectorAll('.shop-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.trail;
      const t = TRAILS.find(x => x.id === id);
      if (!t) return;
      if (t.owned) { equippedTrail = id; renderShop(); return; }
      if (coins >= t.price) { coins -= t.price; t.owned = true; equippedTrail = id; updateHUD(); renderShop(); }
    });
  });

  document.getElementById('shop-continue').addEventListener('click', () => {
    overlay.style.display = 'none';
    fruits=[]; slices=[]; particles=[]; slashPoints=[];
    spawnTimer=0; levelTimer=0;
    state = 'playing';
  });
}

function endGame() {
  state = 'over';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1>Game over</h1>
    <div class="big-score">${score}</div>
    <p style="color:#8888aa">Level: ${level} &nbsp;|&nbsp; 🪙 ${coins} lost</p>
    <p style="color:#cc3333;font-size:13px">You lost everything.</p>
    <button class="obtn" id="play-btn">Play again</button>
  `;
  document.getElementById('play-btn').addEventListener('click', startGame);
}

function startGame() {
  overlay.style.display = 'none';
  init();
  state = 'playing';
}

document.getElementById('play-btn').addEventListener('click', startGame);
loop();
</script>
</body>
</html>
